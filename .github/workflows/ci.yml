name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        # PyPI 인덱스 응답이 일시적으로 비는 경우("from versions: none")가 있어 최대 3번 재시도
        run: |
          for i in 1 2 3; do
            pip install --timeout 60 --retries 5 duckdb "pandas==2.3.3" scipy && exit 0
            echo "pip install 실패 ($i/3), 20초 후 재시도"; sleep 20
          done
          exit 1
      - name: Validate content (problems, answers, links)
        run: python tests/validate_content.py
      - name: Validate statistics functions against scipy
        run: python tests/test_stats.py
      - name: Autocomplete ranking
        run: node tests/test_completion.mjs
      - name: Notebooks are up to date
        run: |
          python scripts/build_notebooks.py
          git diff --exit-code local-spark/notebooks
