name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install duckdb "pandas==2.3.3" scipy
      - name: Validate content (problems, answers, links)
        run: python tests/validate_content.py
      - name: Validate statistics functions against scipy
        run: python tests/test_stats.py
      - name: Autocomplete ranking
        run: node tests/test_completion.mjs
      - name: Notebooks are up to date
        run: |
          python scripts/build_notebooks.py
          git diff --exit-code local-spark/notebooks
